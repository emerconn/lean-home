name: Publish image

# A release (release-plz tags it and creates the GitHub release with an app token, so this runs)
# pushes the multi-arch Docker image (linux/amd64, linux/arm64) to GHCR:
# ghcr.io/<owner>/lean-home:<version> and :latest. Run it by hand to re-publish an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.0.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: meta
        run: |
          . compat/versions.env
          echo "ha_frontend=$HA_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          build-args: HA_FRONTEND=${{ steps.meta.outputs.ha_frontend }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest=${{ steps.build.outputs.digest }}
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Create and push manifest list
        run: |
          version=${TAG##*v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker buildx imagetools create \
            -t "$image:$version" -t "$image:latest" \
            $(printf "$image@sha256:%s " $(ls /tmp/digests))
          echo "### Published \`$image:$version\` and \`:latest\` (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
