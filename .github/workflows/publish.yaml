name: Publish image

# A release (release-plz tags it and creates the GitHub release with an app token, so this runs)
# pushes the Docker image to GHCR: ghcr.io/<owner>/lean-home:<version> and :latest. x86_64 only
# for now; aarch64 is on the roadmap. Run it by hand to re-publish an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.0.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . compat/versions.env
          version=${TAG##*v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg HA_FRONTEND="$HA_FRONTEND" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
          echo "### Published \`$image:$version\` and \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
