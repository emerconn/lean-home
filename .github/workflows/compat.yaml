name: Compat

on:
  # No paths-ignore: `replay` is a required check, and a workflow that never runs blocks the merge.
  # Docs-only changes skip the replay in the job instead (a skipped job counts as passed).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compat-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Docs-only changes can't affect the build or the replay. A failing git diff fails the job (bash -e).
      - id: diff
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD)
          if grep -qvE '^docs/|\.md$' <<< "$files"; then echo code=true >> "$GITHUB_OUTPUT"; fi

  # Replay the recorded HA sessions (compat/fixtures) against lean-home and diff the results, one job per
  # scenario in parallel.
  scenario:
    name: replay ${{ matrix.scenario }}
    needs: compat-changes
    if: needs.compat-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [frontend-load, mqtt-discovery]
    env:
      FRONTEND: ${{ github.workspace }}/bench/.work/venv/lib/python3/site-packages/hass_frontend
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads rust-toolchain.toml on first cargo call, no setup action needed
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Frontend and browser driver
        run: |
          python3 -m venv bench/.work/venv
          . compat/versions.env
          bench/.work/venv/bin/pip install -q "home-assistant-frontend==$HA_FRONTEND"
          # a stable path for FRONTEND, whatever the runner's Python minor version
          ln -s "$(basename bench/.work/venv/lib/python3.*)" bench/.work/venv/lib/python3
          test -f "$FRONTEND/index.html"
          npm --prefix bench/.work/node i -s puppeteer-core
          echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: compat/replay.sh ${{ matrix.scenario }}
      - run: compat/compare.py ${{ matrix.scenario }} compat/fixtures/${{ matrix.scenario }} bench/.work/replay/${{ matrix.scenario }}

  # The required check: one name whatever the scenarios. always(), or a failed scenario would skip this job,
  # and a skipped job counts as passed; skipped scenarios (docs-only) pass.
  replay:
    needs: scenario
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.scenario.result }}" = success -o "${{ needs.scenario.result }}" = skipped
