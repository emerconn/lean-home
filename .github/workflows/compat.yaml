name: Compat

on:
  # No paths-ignore: `replay` is a required check, and a workflow that never runs blocks the merge.
  # Docs-only changes skip the replay in the job instead (a skipped job counts as passed).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compat-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Docs-only changes can't affect the build or the replay. A failing git diff fails the job (bash -e).
      - id: diff
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD)
          if grep -qvE '^docs/|\.md$' <<< "$files"; then echo code=true >> "$GITHUB_OUTPUT"; fi

  # Replay the recorded HA sessions (compat/fixtures) against lean-home and diff the results. One job for both
  # scenarios: as parallel jobs each paid the setup and a cold Chromium, and the total got slower.
  replay:
    needs: compat-changes
    if: needs.compat-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      FRONTEND: ${{ github.workspace }}/bench/.work/venv/lib/python3/site-packages/hass_frontend
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads rust-toolchain.toml on first cargo call, no setup action needed
      # key: replay.sh builds debug; the key doesn't include the profile, so an older release cache under the
      # same key would be restored and never replaced.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: debug
      # Downloads only (the frontend wheel, puppeteer-core); the installs still run, from this cache.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: compat-downloads-${{ hashFiles('compat/versions.env') }}
          restore-keys: compat-downloads-
      - name: Frontend and browser driver
        run: |
          python3 -m venv bench/.work/venv
          . compat/versions.env
          bench/.work/venv/bin/pip install -q "home-assistant-frontend==$HA_FRONTEND"
          # a stable path for FRONTEND, whatever the runner's Python minor version
          ln -s "$(basename bench/.work/venv/lib/python3.*)" bench/.work/venv/lib/python3
          test -f "$FRONTEND/index.html"
          npm --prefix bench/.work/node i -s puppeteer-core
          echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: compat/replay.sh frontend-load
      - run: compat/compare.py frontend-load compat/fixtures/frontend-load bench/.work/replay/frontend-load
      - run: compat/replay.sh mqtt-discovery
      - run: compat/compare.py mqtt-discovery compat/fixtures/mqtt-discovery bench/.work/replay/mqtt-discovery
