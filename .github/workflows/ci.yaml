name: CI

on:
  # Docs-only changes can't affect the build or the replay.
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads rust-toolchain.toml on first cargo call, no setup action needed
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      # Size is a project goal (README): report it on every run so changes show up per PR.
      - name: Binary size
        run: |
          bin=target/release/lean-home
          strip -o lean-home.stripped "$bin"
          size() { awk -v b="$(stat -c %s "$1")" 'BEGIN { printf "%.2f MB (%d bytes)", b / 1e6, b }'; }
          {
            echo "### Binary size (x86_64, release)"
            echo "| | Size |"
            echo "|---|---|"
            echo "| \`lean-home\` | $(size "$bin") |"
            echo "| stripped | $(size lean-home.stripped) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
