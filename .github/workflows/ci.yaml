name: CI

on:
  # No paths-ignore: `ci` is a required check, and a workflow that never runs blocks the merge.
  # Docs-only changes skip the build in the job instead (a skipped job counts as passed).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Docs-only changes can't affect the build or the replay. A failing git diff fails the job (bash -e).
      - id: diff
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD)
          if grep -qvE '^docs/|\.md$' <<< "$files"; then echo code=true >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads rust-toolchain.toml on first cargo call, no setup action needed
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      # Size is a project goal (README): report it on every run so changes show up per PR.
      - name: Binary size
        run: |
          bin=target/release/lean-home
          strip -o lean-home.stripped "$bin"
          size() { awk -v b="$(stat -c %s "$1")" 'BEGIN { printf "%.2f MB (%d bytes)", b / 1e6, b }'; }
          {
            echo "### Binary size (x86_64, release)"
            echo "| | Size |"
            echo "|---|---|"
            echo "| \`lean-home\` | $(size "$bin") |"
            echo "| stripped | $(size lean-home.stripped) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
