name: CI

on:
  # No paths-ignore: `ci` is a required check, and a workflow that never runs blocks the merge.
  # Docs-only changes skip the build in the job instead (a skipped job counts as passed).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Docs and agent/IDE config changes can't affect the build or the replay. A failing git diff fails the job (bash -e).
      - id: diff
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD)
          if grep -qvE '^docs/|^\.(agents|serena|claude)/|\.md$' <<< "$files"; then echo code=true >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: ci-changes
    if: needs.ci-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads rust-toolchain.toml on first cargo call, no setup action needed
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      # Size is a project goal (README): report it on every run so changes show up per PR.
      - name: Binary size
        run: |
          bin=target/release/lean-home
          strip -o lean-home.stripped "$bin"
          size() { awk -v b="$(stat -c %s "$1")" 'BEGIN { printf "%.2f MB (%d bytes)", b / 1e6, b }'; }
          {
            echo "### Binary size (x86_64, release)"
            echo "| | Size |"
            echo "|---|---|"
            echo "| \`lean-home\` | $(size "$bin") |"
            echo "| stripped | $(size lean-home.stripped) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Docker image (Dockerfile) builds and serves: not published, that comes with releases.
  image:
    needs: ci-changes
    if: needs.ci-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build
        run: |
          . compat/versions.env
          docker build --build-arg HA_FRONTEND="$HA_FRONTEND" -t lean-home:ci .
      - name: Smoke test
        run: |
          # A throwaway config with HA's auth files, as the replay uses.
          python3 compat/make-config.py "$RUNNER_TEMP/config"
          docker run -d --name lh -p 127.0.0.1:8123:8123 -v "$RUNNER_TEMP/config:/config" lean-home:ci
          for _ in $(seq 50); do curl -sf http://127.0.0.1:8123/manifest.json >/dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8123/manifest.json >/dev/null || { docker logs lh; exit 1; }
          curl -sf http://127.0.0.1:8123/ | grep -q '<html' || { docker logs lh; exit 1; }
          docker logs lh
      - name: Image size
        run: |
          size=$(docker image inspect lean-home:ci --format '{{.Size}}')
          awk -v b="$size" 'BEGIN { printf "### Image size (x86_64)\n%.1f MB (%d bytes)\n", b / 1e6, b }' | tee -a "$GITHUB_STEP_SUMMARY"
